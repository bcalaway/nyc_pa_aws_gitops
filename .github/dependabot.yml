# Dependabot version updates (Milestone 19, ADR-0024): weekly PRs for
# outdated pinned versions. Every PR still needs Bill's merge, and anything
# that deploys still waits for his approval in the `production` environment.
#
# Grouped so a normal week is a handful of PRs, not dozens: minor and patch
# bumps per ecosystem in one PR, majors on their own (they need reading).
# Security fixes (from Dependabot alerts) skip the schedule and the grouping.
version: 2
updates:
  # Image tags in the compose files.
  - package-ecosystem: docker-compose
    directories: ["/compose/aws", "/compose/nuc", "/compose/nuc/voice-worker"]
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    groups:
      images-minor-patch:
        update-types: [minor, patch]
        # Authentik gets its own PR: it must be upgraded one release line
        # at a time (2026.2 -> 2026.5 -> 2026.8, latest patch of each
        # first), and its "minor" bumps are really those release lines.
        # Dependabot always proposes the newest, so step through by hand
        # when its PR skips a line (docs/gotchas.md, Authentik).
        exclude-patterns: ["*goauthentik*"]
    ignore:
      # Postgres majors need a dump/restore (pg_upgrade), not a tag bump;
      # update_status reports the end-of-life date instead.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # Held at 3.3.2 (3.6.8 stopped log shipping); replaced by Alloy later.
      - dependency-name: grafana/promtail

  # Base images of the images built on the hub and NUCs.
  - package-ecosystem: docker
    directories:
      - "/compose/aws/home-mcp"
      - "/compose/aws/cost-exporter"
      - "/compose/aws/rachio-exporter"
      - "/compose/aws/postgres-backup"
      - "/compose/nuc/mopeka-exporter"
      - "/compose/nuc/weather-exporter"
      - "/compose/nuc/voice-worker/agent"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # postgres-backup must match the server's major (16): a newer
      # pg_dumpall writes dumps the older server can't restore (#31).
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Python requirements of those images.
  - package-ecosystem: pip
    directories:
      - "/compose/aws/home-mcp"
      - "/compose/aws/cost-exporter"
      - "/compose/aws/rachio-exporter"
      - "/compose/nuc/mopeka-exporter"
      - "/compose/nuc/weather-exporter"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # App starter templates (ADR-0014). Nothing here runs on the platform, but
  # every new app is copied from them, so stale or vulnerable pins would be
  # inherited by each new repo. Monthly is enough.
  - package-ecosystem: pip
    directory: "/templates/python"
    schedule:
      interval: monthly
    labels: [dependencies, templates]
    groups:
      template-python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/templates/react"
    schedule:
      interval: monthly
    labels: [dependencies, templates]
    groups:
      template-react:
        patterns: ["*"]

  # Actions used by this repo's workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: "/terraform/aws"
    schedule:
      interval: monthly
    labels: [dependencies]

name: App Build & Push (reusable)

# Called from an app repo's own workflow on merge to main (ADR-0019's CD
# step). Builds the final Dockerfile stage and pushes it to that app's own
# ECR repository, tagged with both the Git SHA and `latest`. Auth is via
# GitHub OIDC assuming the app's own per-app IAM role (terraform/aws/apps.tf)
# -- never a static AWS key, and never access to another app's ECR repo.
#
# This job alone is "manual promote" mode -- the caller repo's own workflow
# decides whether to also call app-deploy.yml immediately after (auto-deploy)
# or leave that for a separate workflow_dispatch trigger later.

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name -- must match its ECR repo and IAM role name (terraform/aws/apps.tf)"
        type: string
        required: true
      dockerfile:
        description: "Path in the caller repo to its Dockerfile"
        type: string
        default: "Dockerfile"
    outputs:
      image_tag:
        description: "Git SHA tag pushed to ECR (also tagged as latest)"
        value: ${{ jobs.build-push.outputs.image_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147856894209:role/${{ inputs.app_name }}-github-actions
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.app_name }}:${{ steps.tag.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.app_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

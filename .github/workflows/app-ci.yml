name: App CI (reusable)

# Called from an app repo's own workflow on every PR (ADR-0019: build,
# test, lint as a required check). Convention (docs/app-platform.md): every
# app's Dockerfile defines `lint` and `test` build stages ahead of its
# final runtime stage -- keeps this workflow language-agnostic instead of
# hardcoding per-language tooling here, across the Python/C++/React starter
# templates.

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path in the caller repo to its Dockerfile"
        type: string
        default: "Dockerfile"
    secrets:
      vcpkg_pat:
        description: >-
          Optional classic GitHub PAT (write:packages/read:packages) for
          vcpkg's GitHub Packages NuGet binary cache -- only consumed by
          Dockerfiles that declare a `--mount=type=secret,id=vcpkg_pat`
          (currently just templates/cpp; harmless no-op for every other
          app's Dockerfile). Pass through with `secrets: inherit` from the
          caller, or omit entirely if the app isn't C++.
        required: false

jobs:
  build-test-lint:
    name: Build, test, lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint
        id: lint
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: lint
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only passed when a caller actually supplies vcpkg_pat -- see
          # app-build-push.yml's identical fix for why an unconditional
          # `vcpkg_pat=` line isn't safe for non-C++ apps.
          secrets: ${{ secrets.vcpkg_pat != '' && format('vcpkg_pat={0}', secrets.vcpkg_pat) || '' }}

      - name: Test
        id: test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only passed when a caller actually supplies vcpkg_pat -- see
          # app-build-push.yml's identical fix for why an unconditional
          # `vcpkg_pat=` line isn't safe for non-C++ apps.
          secrets: ${{ secrets.vcpkg_pat != '' && format('vcpkg_pat={0}', secrets.vcpkg_pat) || '' }}

      - name: Build (final stage)
        id: final
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only passed when a caller actually supplies vcpkg_pat -- see
          # app-build-push.yml's identical fix for why an unconditional
          # `vcpkg_pat=` line isn't safe for non-C++ apps.
          secrets: ${{ secrets.vcpkg_pat != '' && format('vcpkg_pat={0}', secrets.vcpkg_pat) || '' }}

      # CI's logs aren't readable from Claude's sandbox, but annotations are
      # (check-runs/<id>/annotations). On a failure, rebuild the failing stage
      # with plain progress and post its last lines (pytest's failures and
      # short summary, ruff's findings) as an error annotation. The job's own
      # builder still has every layer it built, so only the failing step runs
      # again (no --cache-from: the gha cache needs the action's credentials).
      - name: Report the failure as an annotation
        if: failure() && (steps.lint.outcome == 'failure' || steps.test.outcome == 'failure' || steps.final.outcome == 'failure')
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          VCPKG_PAT: ${{ secrets.vcpkg_pat }}
        run: |
          if [ "$LINT" = failure ]; then stage=lint; elif [ "$TEST" = failure ]; then stage=test; else stage=final; fi
          args=(-f "$DOCKERFILE" --progress=plain)
          [ "$stage" = final ] || args+=(--target "$stage")
          [ -n "$VCPKG_PAT" ] && args+=(--secret id=vcpkg_pat,env=VCPKG_PAT)
          docker buildx build "${args[@]}" . > "$RUNNER_TEMP/build.log" 2>&1 || true
          # Drop BuildKit's "#12 3.456 " step/time prefixes; keep the last 80 lines.
          sed -E 's/^#[0-9]+ [0-9]+\.[0-9]+ //' "$RUNNER_TEMP/build.log" | tail -n 80 > "$RUNNER_TEMP/tail.log"
          msg=$(python3 -c 'import sys; t=open(sys.argv[1], errors="replace").read(); print(t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/tail.log")
          echo "::error title=${stage} stage failed (last 80 lines)::${msg}"

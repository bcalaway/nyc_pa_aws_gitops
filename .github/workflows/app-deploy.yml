name: App Deploy (reusable)

# Called either immediately after app-build-push.yml (auto-deploy mode) or
# later via the caller repo's own workflow_dispatch trigger (manual-promote
# mode) -- see docs/app-platform.md and ADR-0019.
#
# Hosted GitHub runners can't reach the hub directly (its security group
# only allows the WireGuard subnets), so this follows the exact same
# pattern already established for RouterOS (.github/workflows/routeros.yml):
# stage the deploy artifact to the shared ansible-deploy S3 bucket, then use
# SSM Run Command to tell the hub to pull it down and act, using the hub's
# own instance credentials -- never this workflow's.
#
# The actual hub-side deploy logic is a small bash script, built on the
# runner and shipped to SSM as a single base64 blob rather than a raw
# multi-line command string -- avoids fragile nested shell-inside-JSON-
# inside-jq quoting for the parts that need real loops/quoting (the SSM
# secrets convention below). The blob itself is inert (base64 alphabet has
# no shell metacharacters), so there's nothing to escape at the send step.
#
# Secret injection: the hub-side script (not this workflow) reads the app's
# SSM parameters at deploy time and writes them to a .env file next to the
# app's Compose file, by convention:
#   - every parameter under /home-platform/<app_name>/* becomes an env var
#     named from its last path segment (e.g. .../session-secret -> SESSION_SECRET)
#   - /home-platform/postgres/<app_name>-password -> POSTGRES_PASSWORD (if present)
#   - /home-platform/authentik/<app_name>-client-id -> AUTHENTIK_CLIENT_ID (if present)
#   - /home-platform/authentik/<app_name>-client-secret -> AUTHENTIK_CLIENT_SECRET (if present)
# Secrets never pass through this workflow, S3, or GitHub Actions logs --
# only the hub's own instance role (terraform/aws/tls.tf) ever reads them.

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name -- must match its ECR repo and IAM role name (terraform/aws/apps.tf)"
        type: string
        required: true
      compose_file:
        description: "Path in the caller repo to its deploy-time Compose fragment"
        type: string
        default: "deploy/docker-compose.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_BUCKET: home-platform-ansible-deploy-147856894209

jobs:
  deploy:
    name: Deploy to hub
    runs-on: ubuntu-latest
    environment: production
    # Two deploys of the SAME app running concurrently both write and
    # execute /tmp/deploy.sh on the hub -- the same shared path every time,
    # since the deploy script itself has no per-run uniqueness. Confirmed
    # live 2026-08-22: two hue pushes ~30s apart raced on that file, and
    # the second deploy's script got corrupted mid-write ("line 5:
    # .amazonaws.com: command not found" -- a truncated fragment of the ECR
    # registry URL from the OTHER run's script bleeding into this one).
    # Queuing same-app deploys instead of racing them fixes this; different
    # apps still deploy fully in parallel since the group is per app_name.
    concurrency:
      group: app-deploy-${{ inputs.app_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147856894209:role/${{ inputs.app_name }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Stage Compose file to S3
        run: |
          aws s3 cp "${{ inputs.compose_file }}" \
            "s3://${DEPLOY_BUCKET}/apps/${{ inputs.app_name }}/docker-compose.yml"

      - name: Look up hub instance ID
        id: hub
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=home-platform-hub" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::Could not find a running home-platform-hub instance"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build hub-side deploy script
        id: script
        run: |
          APP="${{ inputs.app_name }}"
          cat > /tmp/deploy.sh <<EOF
          set -euo pipefail
          mkdir -p "/home/ec2-user/apps/${APP}"
          aws s3 cp "s3://${DEPLOY_BUCKET}/apps/${APP}/docker-compose.yml" "/home/ec2-user/apps/${APP}/docker-compose.yml"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 147856894209.dkr.ecr.us-east-1.amazonaws.com
          : > "/home/ec2-user/apps/${APP}/.env"
          aws ssm get-parameters-by-path --path "/home-platform/${APP}/" --with-decryption --query "Parameters[*].[Name,Value]" --output text | while IFS=\$'\t' read -r name value; do
            key=\$(basename "\$name" | tr 'a-z-' 'A-Z_')
            echo "\${key}=\${value}" >> "/home/ec2-user/apps/${APP}/.env"
          done
          for cred in "postgres:${APP}-password:POSTGRES_PASSWORD" "authentik:${APP}-client-id:AUTHENTIK_CLIENT_ID" "authentik:${APP}-client-secret:AUTHENTIK_CLIENT_SECRET"; do
            ns=\$(echo "\$cred" | cut -d: -f1)
            param=\$(echo "\$cred" | cut -d: -f2)
            key=\$(echo "\$cred" | cut -d: -f3)
            value=\$(aws ssm get-parameter --name "/home-platform/\${ns}/\${param}" --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
            [ -n "\$value" ] && echo "\${key}=\${value}" >> "/home/ec2-user/apps/${APP}/.env"
          done
          cd "/home/ec2-user/apps/${APP}"
          docker compose pull
          docker compose up -d
          EOF
          echo "b64=$(base64 -w0 /tmp/deploy.sh)" >> "$GITHUB_OUTPUT"

      - name: Send deploy command via SSM
        id: send
        run: |
          CMD=$(jq -n --arg script "${{ steps.script.outputs.b64 }}" \
            '{commands: [("echo " + $script + " | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh")]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.hub.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "App deploy: ${{ inputs.app_name }}, GitHub run ${{ github.run_id }}" \
            --parameters "$CMD" \
            --query "Command.CommandId" --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent command $CMD_ID"

      - name: Poll for completion
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${{ steps.send.outputs.id }}" --details \
              --query "CommandInvocations[0].Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [[ "$STATUS" != "InProgress" && "$STATUS" != "Pending" && "$STATUS" != "" && "$STATUS" != "None" ]]; then
              break
            fi
            sleep 10
          done

      - name: Fetch output and fail on error
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.hub.outputs.id }}" > result.json
          echo "--- stdout ---"
          jq -r '.StandardOutputContent' result.json
          echo "--- stderr ---"
          jq -r '.StandardErrorContent' result.json >&2
          STATUS=$(jq -r '.Status' result.json)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::App deploy failed: $STATUS"
            exit 1
          fi

name: App Deploy (reusable)

# Called either immediately after app-build-push.yml (auto-deploy mode) or
# later via the caller repo's own workflow_dispatch trigger (manual-promote
# mode) -- see docs/app-platform.md and ADR-0019.
#
# Hosted GitHub runners can't reach the hub directly (its security group
# only allows the WireGuard subnets), so this follows the exact same
# pattern already established for RouterOS (.github/workflows/routeros.yml):
# stage the deploy artifact to the shared ansible-deploy S3 bucket, then use
# SSM Run Command to tell the hub to pull it down and act, using the hub's
# own instance credentials -- never this workflow's.
#
# The hub-side deploy logic is scripts/hub/app-deploy.sh, fixed in the
# <app>-deploy SSM document (Milestone 20, ADR-0025). It used to be built
# here and sent with AWS-RunShellScript, which meant the app's role could
# run anything on the hub as root; now it can only run that document.
#
# Secret injection: the hub-side script (not this workflow) reads the app's
# SSM parameters at deploy time and writes them to a .env file next to the
# app's Compose file, by convention:
#   - every parameter under /home-platform/<app_name>/* becomes an env var
#     named from its last path segment (e.g. .../session-secret -> SESSION_SECRET)
#   - /home-platform/postgres/<app_name>-password -> POSTGRES_PASSWORD (if present)
#   - /home-platform/authentik/<app_name>-client-id -> AUTHENTIK_CLIENT_ID (if present)
#   - /home-platform/authentik/<app_name>-client-secret -> AUTHENTIK_CLIENT_SECRET (if present)
# Secrets never pass through this workflow, S3, or GitHub Actions logs --
# only the hub's own instance role (terraform/aws/tls.tf) ever reads them.

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name -- must match its ECR repo and IAM role name (terraform/aws/apps.tf)"
        type: string
        required: true
      compose_file:
        description: "Path in the caller repo to its deploy-time Compose fragment"
        type: string
        default: "deploy/docker-compose.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_BUCKET: home-platform-ansible-deploy-147856894209

jobs:
  deploy:
    name: Deploy to hub
    runs-on: ubuntu-24.04
    environment: production
    # Two deploys of the SAME app running concurrently both write and
    # execute /tmp/deploy.sh on the hub -- the same shared path every time,
    # since the deploy script itself has no per-run uniqueness. Confirmed
    # live 2026-08-22: two hue pushes ~30s apart raced on that file, and
    # the second deploy's script got corrupted mid-write ("line 5:
    # .amazonaws.com: command not found" -- a truncated fragment of the ECR
    # registry URL from the OTHER run's script bleeding into this one).
    # Queuing same-app deploys instead of racing them fixes this; different
    # apps still deploy fully in parallel since the group is per app_name.
    # (The script now runs from a private temp dir via the <app>-deploy
    # document, but two `docker compose up`s on one project would still
    # race, so the queue stays.)
    concurrency:
      group: app-deploy-${{ inputs.app_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147856894209:role/${{ inputs.app_name }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Get the platform's hub scripts
        uses: actions/checkout@v7
        with:
          repository: bcalaway/nyc_pa_aws_gitops
          path: .platform
          sparse-checkout: scripts/hub

      # Early feedback in the app's own run; the hub repeats the check before
      # deploying (ADR-0026). The fragment's env_file (.env) only exists on
      # the hub, so stand in an empty one for `config` here.
      - name: Check memory limits
        run: |
          f="${{ inputs.compose_file }}"
          [ -e "$(dirname "$f")/.env" ] || touch "$(dirname "$f")/.env"
          docker compose -f "$f" config --no-interpolate --format json \
            | python3 .platform/scripts/hub/compose-mem-check.py

      - name: Stage Compose file to S3
        run: |
          aws s3 cp "${{ inputs.compose_file }}" \
            "s3://${DEPLOY_BUCKET}/apps/${{ inputs.app_name }}/docker-compose.yml"

      # The deploy script itself is fixed in the <app>-deploy SSM document
      # (scripts/hub/app-deploy.sh, bundled by terraform/aws/ci-roles.tf); this
      # role may run that document and nothing else on the hub.
      - name: Deploy on the hub
        run: bash .platform/scripts/hub/run-document.sh "${{ inputs.app_name }}-deploy"

name: Terraform (GitHub)

# terraform/github (ADR-0030): GitHub repos for registry apps, with the
# platform's standard settings. This workflow only plans PRs; the apply is a
# step of platform-release.yml, behind the one release approval, and the admin
# token is passed to that step only.
#
# Tokens (fine-grained PATs, set up once by Bill; docs/app-platform.md):
#   TF_GITHUB_READ_TOKEN   repository secret   PR plans (read-only)
#   TF_GITHUB_ADMIN_TOKEN  `production` secret applies, in platform-release.yml
# Both cover "All repositories" so a repo this stack creates is in scope.
# Dependabot PRs get neither (GitHub withholds repo secrets from them), so a
# provider bump's plan fails until Bill re-runs it from a normal PR.

on:
  pull_request:
    paths:
      - 'terraform/github/**'
      - 'apps/registry.yml'
      - '.github/workflows/terraform-github.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One apply at a time against this state.
concurrency:
  group: terraform-github-${{ github.event_name }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform Plan (GitHub)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # State lives in the same S3 bucket as terraform/aws; the read-only
      # plan role can read this stack's state object too (ci-roles.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147856894209:role/home-platform-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the read token is set up
        env:
          TOKEN: ${{ secrets.TF_GITHUB_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=result::TF_GITHUB_READ_TOKEN isn't set (repository secret) -- see docs/app-platform.md, GitHub repos"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/github
        run: terraform init

      - name: Terraform Plan
        # shell: bash runs with -o pipefail, so `terraform ... | tee` fails the
        # step when Terraform fails (the default shell let a failed apply show green).
        shell: bash
        id: plan
        working-directory: terraform/github
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_READ_TOKEN }}
        run: terraform plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/github/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n\n[truncated]' : plan;
            const body = `## Terraform Plan (GitHub)\n\`\`\`\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Summarize plan
        if: always()
        working-directory: terraform/github
        run: |
          line=$(grep -hE '^(Plan: |No changes\.)' plan.txt 2>/dev/null | tail -1)
          echo "::notice title=result::${line:-plan produced no summary}"

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      # Read by Terraform with yamldecode() (ADR-0028, terraform/aws/apps.tf)
      - 'apps/registry.yml'
      # Bundled into the hub's SSM documents (terraform/aws/ci-roles.tf)
      - 'scripts/hub/app-deploy.sh'
      - 'scripts/hub/compose-mem-check.py'
      - 'scripts/hub/preview-up.sh'
      - 'scripts/hub/preview-compose.py'
      - 'scripts/hub/preview-down.sh'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      # Read by Terraform with yamldecode() (ADR-0028, terraform/aws/apps.tf)
      - 'apps/registry.yml'
      # Bundled into the hub's SSM documents (terraform/aws/ci-roles.tf)
      - 'scripts/hub/app-deploy.sh'
      - 'scripts/hub/compose-mem-check.py'
      - 'scripts/hub/preview-up.sh'
      - 'scripts/hub/preview-compose.py'
      - 'scripts/hub/preview-down.sh'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      # Read-only role (terraform/aws/ci-roles.tf, ADR-0025): a pull request --
      # Dependabot's included -- can see the plan but can't change anything,
      # and can't read SSM secrets. It can't write the state lock either,
      # hence -lock=false below; applies still lock.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147856894209:role/home-platform-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/aws
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform/aws
        run: terraform plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/aws/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n\n[truncated]' : plan;
            const body = `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Summarize plan
        if: always()
        working-directory: terraform/aws
        run: |
          line=$(grep -hE '^(Plan: |No changes\.)' plan.txt 2>/dev/null | tail -1)
          echo "::notice title=result::${line:-plan produced no summary}"

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147856894209:role/home-platform-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/aws
        run: terraform apply -auto-approve -no-color 2>&1 | tee apply.txt

      # One-line `result` annotation (home-mcp's last_deploys reads it back;
      # the full log isn't reachable from Claude's sessions).
      - name: Summarize apply
        if: always()
        working-directory: terraform/aws
        run: |
          line=$(grep -hE '^(Apply complete!|No changes\.)' apply.txt 2>/dev/null | tail -1)
          err=$(grep -hE '^Error: ' apply.txt 2>/dev/null | head -1)
          if [ -n "$err" ]; then echo "::error title=result::apply failed: ${err#Error: }"
          else echo "::notice title=result::${line:-apply produced no summary}"; fi

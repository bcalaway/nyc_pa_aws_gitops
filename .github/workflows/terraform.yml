name: Terraform

# PR plans for terraform/aws. Applies happen in platform-release.yml, behind
# the one release approval (Bill, 2026-10-04).

on:
  pull_request:
    paths:
      - 'terraform/**'
      # Read by Terraform with yamldecode() (ADR-0028, terraform/aws/apps.tf)
      - 'apps/registry.yml'
      # Bundled into the hub's SSM documents (terraform/aws/ci-roles.tf)
      - 'scripts/hub/app-deploy.sh'
      - 'scripts/hub/compose-mem-check.py'
      - 'scripts/hub/preview-up.sh'
      - 'scripts/hub/preview-compose.py'
      - 'scripts/hub/preview-down.sh'
      - 'scripts/hub/capture-export.sh'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Read-only role (terraform/aws/ci-roles.tf, ADR-0025): a pull request --
      # Dependabot's included -- can see the plan but can't change anything,
      # and can't read SSM secrets. It can't write the state lock either,
      # hence -lock=false below; applies still lock.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147856894209:role/home-platform-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/aws
        run: terraform init

      - name: Terraform Plan
        # shell: bash runs with -o pipefail, so `terraform ... | tee` fails the
        # step when Terraform fails (the default shell let a failed apply show green).
        shell: bash
        id: plan
        working-directory: terraform/aws
        run: terraform plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/aws/plan.txt', 'utf8');
            // Every resource's action first, one line each, so a long plan
            // (one that adds SSM documents, say) still shows what changes;
            // then as much of the plan as fits, keeping its end.
            const actions = plan.split('\n')
              .filter(l => /^\s+# \S.* (will be|must be|has moved)/.test(l))
              .map(l => l.trim().replace(/^# /, ''));
            const summary = actions.length ? `Resources (${actions.length}):\n${actions.join('\n')}\n\n` : '';
            const room = 60000 - summary.length;
            const shown = plan.length > room ? '[start truncated]\n' + plan.slice(-room) : plan;
            const body = `## Terraform Plan\n\`\`\`\n${summary}${shown}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Summarize plan
        if: always()
        working-directory: terraform/aws
        run: |
          line=$(grep -hE '^(Plan: |No changes\.)' plan.txt 2>/dev/null | tail -1)
          echo "::notice title=result::${line:-plan produced no summary}"

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

[defaults]
inventory = inventory/hosts.yml
remote_user = bcalaway
private_key_file = ~/.ssh/ansible-nuc
# Host keys are pinned in ansible/known_hosts (inventory/hosts.yml sets
# UserKnownHostsFile for the NUCs). A changed key fails the run.
host_key_checking = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

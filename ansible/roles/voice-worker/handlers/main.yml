---
- name: Rebuild voice-agent image
  ansible.builtin.command:
    cmd: docker build --pull -t voice-agent:latest /opt/voice-worker/agent
  changed_when: true

- name: Restart voice-proxy
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: /opt/voice-worker
  changed_when: true

- name: Restart voice-worker runner
  ansible.builtin.systemd:
    name: voice-worker-runner
    state: restarted
    daemon_reload: true

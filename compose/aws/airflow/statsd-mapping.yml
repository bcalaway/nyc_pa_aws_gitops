# StatsD -> Prometheus names for Airflow's metrics (ADR-0027). Airflow sends
# plain dotted StatsD names with ids embedded (prefix "airflow", data.yml);
# these mappings turn the ids into labels. Anything unmapped still comes
# through with dots replaced by underscores.
#
# Used by Grafana alert rules (grafana/provisioning/alerting/rules.yaml,
# group "airflow"): airflow_scheduler_heartbeat, airflow_ti_finish; by the
# Grafana "Airflow" dashboard (dashboards/airflow.json); and by home-mcp's
# airflow_status tool (home-mcp/airflow_view.py). Renaming a metric or label
# here breaks all three.
#
# Checked against live Prometheus 2026-10-04 (Airflow 3): every mapped metric
# also arrives once more with no labels (Airflow's untagged aggregate), so
# queries must filter on a label (dag_id=~".+", state="...") or use max(), not
# a bare sum(). Task slots come from airflow_executor_* (the real limit of 4),
# not airflow_pool_* (default_pool reports 128).
mappings:
  # Task instance finished: airflow.ti.finish.<dag_id>.<task_id>.<state>
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"
  # DAG run duration: airflow.dagrun.duration.<state>.<dag_id>
  - match: "airflow.dagrun.duration.*.*"
    observer_type: summary
    name: "airflow_dagrun_duration"
    labels:
      state: "$1"
      dag_id: "$2"
  # Scheduling delay: airflow.dagrun.schedule_delay.<dag_id>
  - match: "airflow.dagrun.schedule_delay.*"
    observer_type: summary
    name: "airflow_dagrun_schedule_delay"
    labels:
      dag_id: "$1"
  # Per-file parse time: airflow.dag_processing.last_duration.<file> (Airflow 2)
  # and airflow.dag_processing.last_duration.<bundle>.<file> (Airflow 3, bundle
  # "dags-folder"). Airflow 3's values arrive in inconsistent units, so the
  # dashboard doesn't chart them.
  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_last_duration"
    labels:
      file: "$1"
  - match: "airflow.dag_processing.last_duration.*.*"
    name: "airflow_dag_processing_last_duration"
    labels:
      bundle: "$1"
      file: "$2"
  # Seconds since a file was last parsed:
  # airflow.dag_processing.last_run.seconds_ago.<file>
  - match: "airflow.dag_processing.last_run.seconds_ago.*"
    name: "airflow_dag_processing_last_run_seconds_ago"
    labels:
      file: "$1"
  # Pool slots: airflow.pool.<kind>_slots.<pool>
  - match: "airflow.pool.*.*"
    name: "airflow_pool_$1"
    labels:
      pool: "$2"

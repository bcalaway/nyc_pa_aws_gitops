version: 1
metadata:
  name: airflow-proxy
# Airflow UI (ADR-0027): forward-auth in front of airflow.billandjessie.com,
# same as kuma-proxy/umami-proxy. Airflow's own login is off
# (simple_auth_manager_all_admins, compose/aws/data.yml) because this gate
# is the login.
#
# Like the other proxy providers, it must also be assigned to the Embedded
# Outpost by hand once (Admin -> Applications -> Outposts -> authentik
# Embedded Outpost -> Edit -> add "airflow"); until then the UI returns
# Authentik's "not found" page instead of the login.
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: airflow-provider
    identifiers:
      name: airflow
    state: present
    attrs:
      name: airflow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: "https://airflow.billandjessie.com"
  - model: authentik_core.application
    id: airflow-application
    state: present
    identifiers:
      slug: airflow
    attrs:
      name: Airflow
      slug: airflow
      policy_engine_mode: any
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, airflow]]

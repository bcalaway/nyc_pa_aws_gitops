# mkt-ui (market data UI, Milestone 23) at mkt.billandjessie.com: the
# provider and application are named for the app (mkt-ui, so its issuer is
# /application/o/mkt-ui/), the redirect for its hostname. Client id and
# secret are generated once by deploy-hub-stack.sh.
version: 1
metadata:
  name: mkt-ui-oidc
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: mkt-ui-provider
    identifiers:
      name: mkt-ui
    state: present
    attrs:
      name: mkt-ui
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_MKT_UI_CLIENT_ID
      client_secret: !Env AUTHENTIK_MKT_UI_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: "https://mkt.billandjessie.com/auth/callback"
          matching_mode: strict
  - model: authentik_core.application
    id: mkt-ui-application
    state: present
    identifiers:
      slug: mkt-ui
    attrs:
      name: Market data
      slug: mkt-ui
      policy_engine_mode: any
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, mkt-ui]]

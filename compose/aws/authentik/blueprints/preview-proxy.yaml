version: 1
metadata:
  name: preview-proxy
# Per-PR preview environments (ADR-0023): one domain-level forward-auth
# provider covers every <app>-pr<n>.preview.billandjessie.com host. Login
# callbacks go to auth.preview.billandjessie.com (Traefik routes it to
# authentik-server), which sets the session cookie for the whole
# .preview.billandjessie.com domain -- no per-preview Authentik config.
#
# Like kuma-proxy and umami-proxy, the provider must also be assigned to
# the Embedded Outpost by hand once (no safe blueprint path); see
# docs/roadmap.md, Milestone 18 phase 5.
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: preview-provider
    identifiers:
      name: previews
    state: present
    attrs:
      name: previews
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_domain
      external_host: "https://auth.preview.billandjessie.com"
      cookie_domain: "preview.billandjessie.com"
  - model: authentik_core.application
    id: preview-application
    state: present
    identifiers:
      slug: previews
    attrs:
      name: PR previews
      slug: previews
      policy_engine_mode: any
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, previews]]

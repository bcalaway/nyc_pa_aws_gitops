version: 1
metadata:
  name: umami-proxy
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: umami-provider
    identifiers:
      name: umami
    state: present
    attrs:
      name: umami
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: "https://analytics.billandjessie.com"
  - model: authentik_core.application
    id: umami-application
    state: present
    identifiers:
      slug: umami
    attrs:
      name: Umami
      slug: umami
      policy_engine_mode: any
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, umami]]

# Data services (ADR-0027): Airflow as a shared platform scheduler.
#
# Airflow 3, LocalExecutor -- no Celery/Redis queue. Four processes from one
# image: the API server (UI + REST + the Execution API that task processes
# report to), the scheduler (which also runs the tasks, as subprocesses),
# the DAG processor and the triggerer.
#
# Networks: the scheduler, DAG processor and triggerer join `home-platform`,
# like the apps (Postgres, and the apps' /jobs APIs), and the IMDS guard
# (compose/aws/host/) keeps them off the hub's instance-role credentials,
# which matters once DAGs run app code. The API server is only on the internal
# `airflow-api` network (see "Login" below), which the others join too. Only
# the statsd exporter also joins the stack's default network, so Prometheus
# can scrape it.
#
# Secrets come from the stack's .env (scripts/hub/deploy-hub-stack.sh):
# AIRFLOW_DB_PASSWORD (registry platform_databases onboarding), and the
# Fernet key, API secret and JWT secret, generated once into SSM.
#
# DAGs: /home/ec2-user/airflow/dags on the hub, one folder per project
# (dags/<app>/, delivered by that app's deploy; dags/platform/ from this
# repo). Mounted read-only.
#
# Login: Authentik forward-auth in front (blueprints/airflow-proxy.yaml), so
# Airflow's own simple auth manager treats every request as admin. That makes
# GET /auth/token an anonymous admin token, so the API server is only on the
# internal airflow-api network (docker-compose.yml), never home-platform:
# apps can't reach it, only Airflow itself, Traefik and home-mcp.

x-airflow: &airflow
  image: apache/airflow:3.3.2
  restart: unless-stopped
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # A small hub: at most 4 task processes at once across all DAGs.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API__BASE_URL: https://airflow.billandjessie.com
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API__EXPOSE_CONFIG: "False"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    # DAG files only change on a deploy, so re-parse each every 5 minutes, not
    # Airflow's default 30 s, with one parsing process: at 30 s the DAG processor
    # alone used about a quarter of a core all day, and the t3.large's baseline is
    # 30% of its two (2026-10-07). New and changed files are listed every 2
    # minutes, so a deployed DAG shows up within about 2 minutes (a change to an
    # existing one within 5).
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "300"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "120"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    # StatsD -> airflow-statsd-exporter -> Prometheus (job airflow).
    AIRFLOW__METRICS__STATSD_ON: "True"
    AIRFLOW__METRICS__STATSD_HOST: airflow-statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
  volumes:
    - /home/ec2-user/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  # home-platform: apps' /jobs APIs (tasks run in the scheduler) and Postgres.
  # airflow-api: the API server (execution API).
  networks:
    - home-platform
    - airflow-api

services:
  # Runs the database migration on start (the image's _AIRFLOW_DB_MIGRATE),
  # so it comes up first; the others wait until it's healthy.
  airflow-scheduler:
    <<: *airflow
    container_name: airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
    # One AIRFLOW_CONN_<APP> per registry app with airflow: true (ADR-0031):
    # the app's internal URL and its job token. Written by
    # scripts/hub/deploy-hub-stack.sh from the registry and SSM, outside
    # this directory so manual deploys (which don't build it) leave it
    # alone. Only the scheduler needs it: tasks run here (LocalExecutor).
    env_file:
      - path: /home/ec2-user/airflow/connections.env
        required: false
    # Tasks run inside this container (LocalExecutor), so their memory
    # counts here. Initial limits per ADR-0026, resized from the
    # Containers dashboard after a week.
    mem_limit: 1g
    # When a deploy recreates Postgres (a Postgres patch, now its own PR), the
    # scheduler loses its database and can hang mid-shutdown, never exiting,
    # so `restart: unless-stopped` never fires (2026-10-06, docs/gotchas.md).
    # restart: true makes Compose restart it whenever it restarts Postgres.
    depends_on:
      postgres:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 3m

  airflow-api-server:
    <<: *airflow
    container_name: airflow-api-server
    command: api-server
    mem_limit: 1g
    # Only airflow-api: never home-platform (see the header).
    networks:
      - airflow-api
    depends_on:
      airflow-scheduler:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airflow-api"
      - "traefik.http.routers.airflow.rule=Host(`airflow.billandjessie.com`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls.certresolver=route53"
      - "traefik.http.routers.airflow.middlewares=hsts@docker,authentik-forward-auth@docker"
      - "traefik.http.routers.airflow.service=airflow"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      # Authentik's outpost callback/logout paths on this host go straight
      # to authentik-server, not through the forward-auth middleware --
      # same as umami-outpost (web.yml) and kuma-outpost (core.yml).
      - "traefik.http.routers.airflow-outpost.rule=Host(`airflow.billandjessie.com`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.airflow-outpost.entrypoints=websecure"
      - "traefik.http.routers.airflow-outpost.tls.certresolver=route53"
      - "traefik.http.routers.airflow-outpost.service=auth@docker"

  airflow-dag-processor:
    <<: *airflow
    container_name: airflow-dag-processor
    command: dag-processor
    mem_limit: 768m
    depends_on:
      airflow-scheduler:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 1m

  airflow-triggerer:
    <<: *airflow
    container_name: airflow-triggerer
    command: triggerer
    # 768m since 2026-10-05: it peaked at 445 MB of 512 MB during the Treasury
    # backfill (mkt-data docs/phase-2.md, B6), more Asset-scheduled DAGs since.
    mem_limit: 768m
    depends_on:
      airflow-scheduler:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 1m

  # Airflow emits StatsD; this turns it into Prometheus metrics
  # (airflow/statsd-mapping.yml names the ones the alerts use).
  airflow-statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    container_name: airflow-statsd-exporter
    restart: unless-stopped
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --statsd.listen-tcp=:9125
      - --web.listen-address=:9102
    volumes:
      - ./airflow/statsd-mapping.yml:/etc/statsd/mapping.yml:ro
    mem_limit: 128m
    networks:
      - default
      - home-platform
      - airflow-api  # the API server sends its StatsD from there

# Hub stack entry point (ADR-0029). Services live in the included files,
# grouped by role; volumes and networks stay here, defined once.
#   core.yml           Traefik, Authentik, Postgres, Redis, home-mcp
#   observability.yml  Prometheus, Loki, Alloy, Grafana, Uptime Kuma, exporters, cAdvisor
#   web.yml            Umami
#   data.yml           Airflow (ADR-0027) and its statsd exporter
#
# `include` needs Docker Compose >= 2.20; scripts/hub/deploy-hub-stack.sh
# checks the hub's version before deploying.
include:
  - core.yml
  - observability.yml
  - web.yml
  - data.yml

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  uptime-kuma-data:
  promtail-positions:
  alloy-data:
  postgres-data:
  backup-metrics:
  redis-data:
  authentik-media:
  authentik-templates:
  authentik-certs:
  traefik-letsencrypt:
  airflow-logs:

networks:
  # Created once on the hub via `docker network create home-platform` --
  # external here (not Compose-managed) so per-app deploys can declare the
  # same name as external:true and join it without needing to know or
  # recreate this stack's own compose project network. See app-platform.md's
  # Networking section (Milestone 11).
  home-platform:
    external: true
  # Per-PR previews (ADR-0023). `internal: true` -- no route to the
  # internet -- created once by scripts/hub/deploy-hub-stack.sh
  # (`docker network create --internal preview`). Only Traefik and
  # Postgres join it from this stack.
  preview:
    external: true

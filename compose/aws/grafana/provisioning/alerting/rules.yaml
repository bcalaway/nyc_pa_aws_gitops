apiVersion: 1

groups:
  - orgId: 1
    name: disk-space
    folder: Alerts
    interval: 5m
    rules:
      - uid: disk-space-low
        title: Disk space low
        # Same query shape as the System Overview dashboard's "Disk Usage %"
        # panel (compose/aws/grafana/provisioning/dashboards/system-overview.json)
        # -- reuses its proven fstype exclusion filter and datasource UID
        # rather than inventing a new query pattern.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is {{ $values.A }}% full on {{ $labels.mountpoint }}"
          description: "Disk usage on {{ $labels.instance }} ({{ $labels.mountpoint }}) has been above 85% for 15 minutes. Hosts monitored: aws-hub, nas2, nuc4, nuc5 (see compose/aws/prometheus/prometheus.yml's node-exporter job)."

  - orgId: 1
    name: postgres-backup
    folder: Alerts
    interval: 1h
    rules:
      - uid: postgres-backup-stale
        title: Postgres backup stale
        # postgres_backup_last_success_timestamp_seconds comes from
        # compose/aws/postgres-backup/backup.sh via node-exporter's textfile
        # collector (docker-compose.yml) -- written only after a successful
        # pg_dumpall + S3 upload, so staleness covers both "the backup ran
        # and failed" and "cron never fired at all" with one query.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: time() - postgres_backup_last_success_timestamp_seconds{instance="aws-hub"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [259200]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # Unlike disk-space-low: no data for this metric IS the failure --
        # it means the backup has never succeeded, or node-exporter/textfile
        # wiring itself is broken, both of which should alert rather than
        # silently sit in "no data" state.
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres backup on {{ $labels.instance }} hasn't succeeded in over 3 days"
          description: "postgres-backup (compose/aws/postgres-backup) hasn't reported a successful pg_dumpall-to-S3 backup in over 3 days, or the metric is missing entirely. Check `docker logs postgres-backup` and `docker exec postgres-backup cat /var/log/cron.log` on the hub."

  - orgId: 1
    name: tls-cert-expiry
    folder: Alerts
    interval: 1h
    rules:
      - uid: tls-cert-expiring-soon
        title: TLS certificate expiring soon
        # traefik_tls_certs_not_after (compose/aws/grafana/provisioning/dashboards/traefik.json's
        # own expiry panel) is a Unix timestamp per cert CN. Traefik auto-renews via
        # Let's Encrypt DNS-01 around 30 days before expiry (90-day certs) --
        # under 14 days remaining means renewal has already failed at least
        # once (Route53 API issue, IMDS credential problem, etc.), not just
        # "renewal hasn't happened yet".
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: (traefik_tls_certs_not_after - time()) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [14]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No data means Traefik isn't reporting cert metrics at all (down, or
        # metrics wiring broken) -- alert rather than sit silent, same
        # reasoning as postgres-backup-stale.
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS cert for {{ $labels.cn }} expires in under 14 days"
          description: "traefik_tls_certs_not_after shows {{ $labels.cn }} has under 14 days of validity left, or the metric is missing entirely. Let's Encrypt certs renew automatically around 30 days out, so this means auto-renewal has already failed at least once -- check `docker logs traefik` for ACME errors (Route53 API/IMDS credential issues are the usual cause)."

  - orgId: 1
    name: printer
    folder: Alerts
    interval: 5m
    rules:
      - uid: printer-offline
        title: Printer offline
        # ICMP from nuc4's blackbox-exporter (prometheus.yml's blackbox-lan
        # job). Added 2026-09-26 after the NYC printer sat powered off from
        # Sep 10 to Sep 26 with nobody noticing -- AirPrint jobs from iOS just
        # failed silently. Ping covers both "off / no link" and "hung".
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: probe_success{job="blackbox-lan",instance="printer"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No data means nuc4 or its blackbox-exporter is unreachable -- a
        # different problem that shouldn't masquerade as the printer being off.
        noDataState: NoData
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "NYC printer (10.0.1.5) has been unreachable for 30 minutes"
          description: "The HP M455dn at 10.0.1.5 hasn't answered ping from nuc4 for 30+ minutes, so AirPrint from phones/laptops will fail. Usually it's been switched off -- press its power button. If the screen is on but it still won't respond, power-cycle it. Its switch port is sw-desk gi5 (ifOperStatus in Prometheus shows whether the link is up)."

      - uid: printer-toner-low
        title: Printer toner low
        # Printer-MIB via snmp-printer job (compose/aws/snmp-exporter/printer.yml).
        # level/max rather than raw level so it stays right on a printer that
        # reports absolute units; level >= 0 filters the -2/-3 sentinels.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: '100 * prtMarkerSuppliesLevel{job="snmp-printer"} / prtMarkerSuppliesMaxCapacity{job="snmp-printer"} and prtMarkerSuppliesLevel{job="snmp-printer"} >= 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No data = printer unreachable or asleep-and-unresponsive; the
        # printer-offline rule above owns that case.
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Printer toner low: {{ $labels.supply }} at {{ humanize $values.A.Value }}%"
          description: "{{ $labels.supply }} in the NYC HP M455dn is under 10%. Time to order a replacement (HP 414A / W202xA, standard yield)."
      - uid: printer-out-of-paper
        title: Printer out of paper
        # Tray 2 is the main 250-sheet cassette. This printer reports -3
        # ("some paper, count unknown") when loaded and 0 when empty. Tray 1
        # (manual feed) is normally empty, so it is deliberately excluded.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'prtInputCurrentLevel{job="snmp-printer",tray="Tray 2"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No data = printer unreachable or asleep-and-unresponsive; the
        # printer-offline rule above owns that case.
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NYC printer is out of paper (Tray 2)"
          description: "Tray 2 on the NYC HP M455dn reports empty. Load paper -- iPhone/iPad/Mac print jobs will stall until then."
      - uid: printer-needs-attention
        title: Printer needs attention
        # hrPrinterDetectedErrorState bits (HOST-RESOURCES-MIB). One series
        # per condition, so the alert names which one fired. "Device
        # assessment with configuration server failed" in the printer's
        # syslog is unrelated and harmless (boot-time lookup for an HP fleet
        # management server that doesn't exist here).
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'hrPrinterDetectedErrorState{job="snmp-printer",hrPrinterDetectedErrorState=~"jammed|doorOpen|serviceRequested|noToner|markerSupplyMissing|offline"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No data = printer unreachable or asleep-and-unresponsive; the
        # printer-offline rule above owns that case.
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NYC printer needs attention: {{ $labels.hrPrinterDetectedErrorState }}"
          description: "The NYC HP M455dn is reporting {{ $labels.hrPrinterDetectedErrorState }}. Printing is blocked until it is cleared at the printer. The front-panel message is on the Printer dashboard in Grafana."

  # Airflow (ADR-0027). Metrics come from airflow-statsd-exporter (Prometheus
  # job "airflow", names in compose/aws/airflow/statsd-mapping.yml).
  - orgId: 1
    name: airflow
    folder: Alerts
    interval: 5m
    rules:
      - uid: airflow-heartbeat-stale
        title: Airflow heartbeat stale
        # End-to-end check: dags/platform/platform_heartbeat.py succeeds
        # hourly, which needs the DAG processor, scheduler, executor and
        # Execution API all working. `or vector(0)` turns "metric missing"
        # (Airflow or the exporter down) into 0, so that alerts too. The 90m
        # `for` covers a fresh deploy, where increase() needs a second
        # success (about an hour) before it reads above 0.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum(increase(airflow_ti_finish{dag_id="platform_heartbeat",state="success"}[2h])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: "Airflow's hourly platform_heartbeat hasn't succeeded in 2 hours"
          description: "No successful platform_heartbeat task in the last 2 hours: Airflow's scheduler, DAG processor or API server may be down or stuck. Check https://airflow.billandjessie.com and `docker ps --filter name=airflow` on the hub."

      - uid: airflow-scheduler-down
        title: Airflow scheduler not heartbeating
        # The fast check (2026-10-06): the scheduler heartbeats every few
        # seconds, so no heartbeat for 10 minutes means it's down or hung.
        # airflow-heartbeat-stale above is the slow end-to-end check (about
        # 3.5 hours); on 2026-10-06 the scheduler hung for 80 minutes after a
        # Postgres restart and came back before that one fired. `or vector(0)`
        # makes Airflow or the exporter being down alert too; the 10m `for`
        # covers a deploy's restart (about 2 minutes without heartbeats).
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum(rate(airflow_scheduler_heartbeat[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    # Grafana's thresholds are gt, lt, within_range and
                    # outside_range only (no lte): below 0.001/s is none.
                    type: lt
                    params: [0.001]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Airflow's scheduler hasn't heartbeated in 10 minutes"
          description: "No scheduler heartbeat for 10 minutes: no DAG runs or tasks start until it's back. It can hang without exiting after a Postgres restart (docs/gotchas.md), which Docker won't restart: check home-mcp airflow_status and recent_logs airflow-scheduler, then restart it (`docker restart airflow-scheduler` on the hub) or redeploy the hub, which restarts unhealthy services first."

      - uid: airflow-task-failed
        title: Airflow task failed
        # Any task that ended in state "failed" (after its retries). The
        # `unless ... offset` half catches a dag/task's first failure since
        # the exporter started, where the counter appears already at 1 and
        # increase() alone would read 0.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: (sum by (dag_id, task_id) (increase(airflow_ti_finish{state="failed"}[30m])) > 0) or (count by (dag_id, task_id) (airflow_ti_finish{state="failed"} unless airflow_ti_finish{state="failed"} offset 30m))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        # No failures = no series = fine.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Airflow task failed: {{ $labels.dag_id }}.{{ $labels.task_id }}"
          description: "Task {{ $labels.task_id }} in DAG {{ $labels.dag_id }} failed after its retries. Logs are in the Airflow UI (https://airflow.billandjessie.com) under the failed run."

  - orgId: 1
    name: mkt-data
    folder: Alerts
    interval: 15m
    rules:
      - uid: mkt-data-capture-stale
        title: Market data capture stale
        # mkt-data's /metrics (mkt-data app/metrics.py). Each source is held to its
        # own DAG's schedule (mkt_data_source_late_after_seconds, from mkt-data's
        # app/source_status.py; the Sources screen's "Late"): 8 days for the weekly
        # calendar pages, 5 days for the weekday sources (a closed day on each side
        # of a weekend is 4 days without a fetch). A was "over 8 days" for every
        # source until 2026-10-07. No data means mkt-data isn't serving metrics at
        # all (down, or the scrape is broken): alert, as with postgres-backup-stale.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: (time() - max by (calendar, source) (mkt_data_source_last_success_timestamp_seconds)) - on (calendar, source) max by (calendar, source) (mkt_data_source_late_after_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Market data source {{ $labels.source }} ({{ $labels.calendar }}) late against its schedule"
          description: "mkt-data hasn't fetched {{ $labels.source }} successfully for longer than its DAG's schedule allows (mkt_data_source_late_after_seconds), or mkt-data isn't serving /metrics. The value is how far past that it is, in seconds. mkt-ui's Sources screen shows the source's DAG and recent fetches; also home-mcp mkt_data_checks, and the DAG in Airflow."

      - uid: mkt-data-parse-failed
        title: Market data parse failed
        # The source's latest parse (capture or reparse) failed. The raw
        # capture is kept; fix the parser, deploy, then reparse.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: min by (calendar, source) (mkt_data_source_parse_ok)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Market data parse failed: {{ $labels.source }} ({{ $labels.calendar }})"
          description: "mkt-data's latest parse of {{ $labels.source }} failed (raw capture kept). Read the real wording with home-mcp mkt_data_capture_text, fix the parser, deploy, then POST /jobs/calendars/{{ $labels.calendar }}/reparse."

      - uid: mkt-data-next-year-missing
        title: Market data next year not published
        # Next year isn't covered by a publisher (rules and projections don't
        # count) and it's past the calendar's usual publish date: always for
        # FED and NYSE, from Dec 20 for SIFMA-US. From calendar-svc's golden
        # calendars since phase 2 (mkt-data's docs/phase-2.md, step A5); the
        # uid stays so the rule's history carries on.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: max by (calendar, year) (calendar_svc_calendar_next_year_overdue)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.calendar }} hasn't published {{ $labels.year }} yet"
          description: "No publisher covers {{ $labels.year }} for calendar {{ $labels.calendar }}, past its usual publish date, so its dates are still projected from rules (calendar-svc). Check the publisher's page and whether mkt-data's capture or parser missed the new year (home-mcp mkt_data_capture_text), then whether calendar-svc's load ran."

  - orgId: 1
    name: calendar-svc
    folder: Alerts
    interval: 15m
    rules:
      - uid: calendar-svc-load-stale
        title: Calendar load stale
        # calendar-svc's /metrics (calendar-svc app/metrics.py). Its load runs
        # nightly and on every mkt-data calendar capture, so 30 hours without a
        # successful one means the DAG, calendar-svc or mkt-data's gRPC is
        # broken. No data means calendar-svc isn't serving metrics: alert.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: time() - max(calendar_svc_load_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "calendar-svc hasn't loaded the calendars in 30 hours"
          description: "calendar-svc's last successful load from mkt-data's near-raw rows is over 30 hours old, or it isn't serving /metrics. Check calendar_svc__load in Airflow (home-mcp airflow_runs, airflow_task_log) and `docker logs calendar-svc` on the hub."

      - uid: calendar-svc-load-failed
        title: Calendar load failed
        # The latest load failed (calendar-svc records each run in load_run).
        # The golden calendars keep their last good state.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: min(calendar_svc_load_ok)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "calendar-svc's latest calendar load failed"
          description: "calendar-svc's latest load failed; the calendars keep their last good state. The calendar_svc__load task log (home-mcp airflow_task_log) has the reason, e.g. mkt-data's gRPC unreachable."

  - orgId: 1
    name: quote-svc
    folder: Alerts
    interval: 15m
    rules:
      - uid: quote-svc-curve-missing
        title: Treasury curve missing
        # quote-svc's /metrics (quote-svc app/freshness.py, mkt-data docs/phase-2.md
        # step B8). The curve for a SIFMA-US business day is due by 9:00 a.m. New
        # York the next day (Treasury posts by about 6 p.m.; mkt_data__ust_par
        # retries until 10 p.m.). quote-svc works out the due date with calendar-svc's
        # closes, so a holiday never alerts. No data means quote-svc isn't serving
        # metrics: alert.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: max(quote_svc_curve_missing) or (max(quote_svc_curve_active_instruments) < bool 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Treasury curve missing for the latest business day"
          description: "No Treasury par yield curve (UST-PAR) has reached quote-svc for the latest business day it was due, or no instrument has had one in 30 days. Check mkt_data__ust_par in Airflow (home-mcp airflow_runs, airflow_task_log), then quote_svc__load; Treasury's page may be late. The Market data dashboard's Treasury row shows which instruments."

      - uid: quote-svc-sources-disagree
        title: Treasury sources disagree
        # Treasury's par curve and the Fed's H.15 have given identical values on
        # every shared date since 1990 (B6), so any difference is news: a revision on
        # one side, or a parser problem.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum(quote_svc_source_disagreements)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Treasury and H.15 disagree on {{ $values.A.Value }} date(s)"
          description: "UST-PAR and H15-TCM give different values for the same instrument and date. quote-svc's metric quote_svc_source_disagreement_bp lists them (instrument, date, both values); GET /jobs/compare on quote-svc shows the series. Golden uses Treasury's."

      - uid: quote-svc-load-stale
        title: Quote load stale
        # quote-svc's load runs on every new capture and nightly at 07:13 UTC, so
        # 30 hours without a successful one means the DAG, quote-svc or its upstreams
        # are broken. No data means quote-svc isn't serving metrics: alert.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: time() - max(quote_svc_load_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "quote-svc hasn't loaded quotes in 30 hours"
          description: "quote-svc's last successful load from mkt-data is over 30 hours old, or it isn't serving /metrics. Check quote_svc__load in Airflow (home-mcp airflow_runs, airflow_task_log) and `docker logs quote-svc` on the hub."

      - uid: quote-svc-load-failed
        title: Quote load failed
        # The latest load failed (recorded in load_run). Months already loaded are
        # kept; the next load retries the rest.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: min(quote_svc_load_ok)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "quote-svc's latest quote load failed"
          description: "quote-svc's latest load failed; months already loaded are kept. The quote_svc__load task log (home-mcp airflow_task_log) has the reason, e.g. mkt-data's or secmaster-svc's gRPC unreachable."

      - uid: quote-svc-unmapped-keys
        title: Quote source keys unmapped
        # A source key secmaster-svc has no instrument for: its values aren't loaded.
        # Usually a new tenor (Treasury added the 1.5-month in 2025); add it to
        # secmaster-svc's seeds/cmt.toml. For TD-PRICES, a CUSIP secmaster-svc hasn't
        # loaded yet; quote-svc reloads those days once it has.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum(quote_svc_unmapped_keys)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} source key(s) have no instrument"
          description: "quote-svc saw source keys secmaster-svc can't map, so their values aren't loaded. quote_svc_unmapped_key lists them (first 50 per source). For the CMTs, add the instrument or identifier to secmaster-svc's seeds/cmt.toml in a PR; for TD-PRICES (CUSIPs), secmaster-svc hasn't loaded the security yet: check secmaster_svc__load. Those days reload by themselves once it has."

      - uid: quote-svc-prices-missing
        title: Treasury prices missing
        # quote-svc's /metrics (quote-svc app/freshness.py, mkt-data docs/phase-3.md step 4).
        # FedInvest prints a business day's end-of-day prices the next business day
        # evening (mkt-data's capture at 7:15 p.m. re-fetches the previous day), so day D's
        # are due by 9:00 a.m. the day after that; quote-svc works out the due date with
        # calendar-svc's closes. Outstanding: active securities priced in the last 10 days,
        # so matured and not-yet-issued ones never alert. No data: quote-svc isn't serving metrics.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: max(quote_svc_prices_missing_count) or (max(quote_svc_prices_outstanding) < bool 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Treasury prices missing for the latest business day due"
          description: "Some outstanding Treasury securities have no FedInvest end-of-day price for the business day due, or none has a price in 10 days. quote_svc_prices_missing names them (first 20). Check mkt_data__treasury_securities_capture's TD-PRICES task (home-mcp airflow_runs, airflow_task_log), then quote_svc__load; FedInvest may be late."
      - uid: quote-svc-prices-implausible
        title: Treasury prices implausible
        # quote-svc's /metrics (quote-svc app/sanity.py, mkt-data docs/phase-3.md step 7): the
        # latest priced day against the one before, for active securities. Stale: over 80%
        # unchanged (a repeated page; real days peak at 54% in 18 years of FedInvest). Jumps:
        # a move past its type's limit per 100 (bills and FRNs 0.5, notes 5, TIPS 15, bonds 12;
        # in 18 years only two bill moves pass, SVB's 2023-03-13 among them). Set from
        # quote_svc__price_sanity_history on 2026-10-07. No data is "Treasury prices missing"'s.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: (max(quote_svc_prices_stale) + max(quote_svc_prices_jumps_count)) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The latest Treasury end-of-day prices look wrong"
          description: "quote-svc's price sanity check flags the latest FedInvest day: quote_svc_prices_stale is 1 when over 80% of prices didn't move (a repeated page), and quote_svc_prices_jump names prices that moved more than their type plausibly can (first 20; a misread column or a shifted decimal, or a truly extraordinary day). Compare with the capture (home-mcp mkt_data_capture_text) and the market; a fixed page reaches quote-svc through mkt-data's next capture or a TD-PRICES rebuild."

  - orgId: 1
    name: secmaster-svc
    folder: Alerts
    interval: 15m
    rules:
      - uid: secmaster-svc-seed-failed
        title: Security master seed failed
        # secmaster-svc's /metrics. The seed file is applied at every start and on
        # POST /jobs/seed; a failure keeps the previous instruments.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: min(secmaster_svc_seed_ok)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "secmaster-svc's latest seed failed"
          description: "secmaster-svc couldn't apply a seed file (seeds/cmt.toml); the instruments keep their previous state. `docker logs secmaster-svc` on the hub has the reason, usually a bad entry in the file."

      - uid: secmaster-svc-load-stale
        title: Securities load stale
        # secmaster-svc's load runs when TreasuryDirect's records change and nightly at
        # 07:27 UTC, so 30 hours without a successful one means the DAG, secmaster-svc or
        # mkt-data is broken. No data: secmaster-svc isn't serving metrics.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: time() - max(secmaster_svc_load_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "secmaster-svc hasn't loaded securities in 30 hours"
          description: "secmaster-svc's last successful load of Treasury securities from mkt-data is over 30 hours old, or it isn't serving /metrics. Check secmaster_svc__load in Airflow (home-mcp airflow_runs, airflow_task_log) and `docker logs secmaster-svc` on the hub."

      - uid: secmaster-svc-load-failed
        title: Securities load failed
        # The latest load failed (recorded in load_run). Months already loaded are kept;
        # the next load retries the rest.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: min(secmaster_svc_load_ok)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "secmaster-svc's latest securities load failed"
          description: "secmaster-svc's latest load of Treasury securities failed; months already loaded are kept. The secmaster_svc__load task log (home-mcp airflow_task_log) has the reason."

      - uid: secmaster-svc-untyped-records
        title: Securities records untyped
        # A TreasuryDirect record secmaster-svc couldn't type into terms isn't loaded:
        # usually a new field value (a security type or term it doesn't know).
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum(secmaster_svc_untyped_records) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} TreasuryDirect record(s) couldn't be typed"
          description: "secmaster-svc couldn't type some TreasuryDirect records into security terms, so those securities or auctions aren't loaded. The load's answer (secmaster_svc__load task log) and the untyped_record table say which and why; fix the typing in secmaster-svc's app/treasuries.py."
      - uid: secmaster-svc-auction-results-overdue
        title: Auction results overdue
        # An auction held before today (in the last 30 days) whose results secmaster-svc
        # still hasn't loaded: Treasury publishes them the same afternoon, so the day's
        # TreasuryDirect capture or the load is behind. 12 hours' grace covers the gap
        # between an auction and the next capture and load.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: max(secmaster_svc_auction_results_overdue) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: Error
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} Treasury auction(s) held without results loaded"
          description: "secmaster-svc has auctions from before today with no results (amount accepted) yet. secmaster_svc_auction_result_overdue lists them by CUSIP and auction date (the first 10). Check that mkt_data__treasury_securities_capture captured TD-SECURITIES since the auction (home-mcp mkt_data_checks, source TD-SECURITIES) and that secmaster_svc__load ran after it; home-mcp mkt_data_auctions shows what each auction has."

# Mopeka tank-sensor map, read by mopeka_exporter.py at startup.
#
# `name`  -- the exporter sets the `sensor` label on every metric from this.
#            A MAC not listed falls back to the sensor's firmware name
#            ("Pro Check 9FA8"), which is the cue that a new tank appeared
#            and needs an entry. Edit -> PR -> scripts/deploy-nucs.ps1.
#
# level -> percent:
#   `mopeka_sensor_tank_level_mm` (raw: height of propane above the sensor)
#   is always exported. Add `full_mm` (and optionally `empty_mm`, default 0)
#   to also get `mopeka_sensor_fill_percent`:
#     clamp(100 * (level - empty_mm) / (full_mm - empty_mm), 0, 100)
#   Linear -- correct for these vertical DOT cylinders (grill + RV tanks).
#
#   The full_mm values below are ESTIMATES from the nominal tank size, so
#   the panel isn't blank. To make them exact, either:
#     (a) read the % the Mopeka phone app shows for each tank and tell
#         Claude -- full_mm = raw_mm / (app_percent / 100); or
#     (b) note each tank's raw reading right after its next fill.
#   The raw mm is ground truth regardless of full_mm.

sensors:
  # 40 lb (10 gal) DOT cylinders
  "D4:32:71:CD:9F:A8": { name: "RV Right",         full_mm: 560 }  # ESTIMATE (40 lb)
  "FB:10:69:78:C5:8B": { name: "RV Left",          full_mm: 560 }  # ESTIMATE (40 lb)
  # 30 lb (7.5 gal) DOT cylinders
  "E8:E2:7F:AC:71:D8": { name: "Downstairs Left",  full_mm: 430 }  # ESTIMATE (30 lb)
  "C6:41:60:E7:C2:90": { name: "Downstairs Right", full_mm: 430 }  # ESTIMATE (30 lb)
  # 20 lb (5 gal) DOT cylinders
  "E8:96:9A:1A:94:A2": { name: "Grill 1",          full_mm: 280 }  # ESTIMATE (20 lb)
  "CA:5C:F8:2E:F5:30": { name: "Grill 2",          full_mm: 280 }  # ESTIMATE (20 lb)

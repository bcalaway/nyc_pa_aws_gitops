# Egress allowlist for voice-agent containers (Milestone 18, ADR-0021).
# The agent's network (voice-agent-net) is `internal: true`: it has no
# route out except this proxy. Only these destinations are reachable, so a
# prompt-injected agent can't exfiltrate its Claude token or code anywhere
# else, and can't reach GitHub at all (the runner does the push itself).
http_port 3128

acl allowed_sites dstdomain .anthropic.com .claude.ai .claude.com
acl allowed_sites dstdomain pypi.org files.pythonhosted.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed_sites
http_access deny all

cache deny all
# Logs: the image's defaults (/var/log/squid/access.log, cache.log) --
# squid drops to the unprivileged 'proxy' user, which can't open /dev/stdout.

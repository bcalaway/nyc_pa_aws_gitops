# Named jobs voice can run (ADR-0022). Each job runs on the EC2 hub via
# SSM from .github/workflows/voice-job.yml, after Bill approves it in the
# `production` environment. home-mcp only reads this file and asks GitHub
# to start the workflow; the workflow re-validates every request against
# this file before anything runs.
#
# Fields:
#   say          how Bill would ask for it (read out by list_jobs)
#   description  one line, read out by list_jobs
#   args         {name: [allowed values]} -- enums only, never free text
#   script       scripts/jobs/<script>, run as root on the hub with
#                `<bucket> <arg values in the order listed>`; must end by
#                printing one `RESULT: <spoken sentence>` line
#   stage        repo directories to upload to the deploy bucket first
#                (compose/aws, ansible, compose/nuc), for jobs that deploy them
#   timeout_minutes  SSM execution timeout
#
# Adding a job, or a new allowed value, is a PR. Keep args enum-only.

restart-app:
  say: "restart todo-app / restart hue"
  description: Restart one app's containers on the hub, then check its health endpoint
  args:
    app: [todo-app, hue]
  script: restart-app.sh
  timeout_minutes: 5

deploy-nucs:
  say: "deploy the NUCs"
  description: Run the NUC Ansible playbook from main (also rolls out the latest hue agent image); unreachable NUCs are skipped
  args: {}
  script: deploy-nucs.sh
  stage: [ansible, compose/nuc]
  timeout_minutes: 40

deploy-hub:
  say: "redeploy the hub"
  description: Redeploy the hub stack (compose/aws) from main
  args: {}
  script: deploy-hub.sh
  stage: [compose/aws]
  timeout_minutes: 30

postgres-backup-now:
  say: "back up Postgres now"
  description: Run the nightly Postgres backup immediately and upload it to S3
  args: {}
  script: postgres-backup-now.sh
  timeout_minutes: 15

hub-docker-prune:
  say: "clean up Docker on the hub"
  description: Remove unused Docker images older than 7 days on the hub and report the space freed
  args: {}
  script: hub-docker-prune.sh
  timeout_minutes: 10

preview-cleanup:
  say: "clean up previews"
  description: Remove PR previews whose PR is closed, that are over 7 days old, or that were left behind (same as the nightly sweep)
  args: {}
  script: preview-cleanup.sh
  timeout_minutes: 10

exposure-check-now:
  say: "run the exposure check now"
  description: Rescan the hub and both sites from the internet for open ports (normally weekly); results go to the exposure_check tool, not the job log
  args: {}
  script: exposure-check-now.sh
  timeout_minutes: 60

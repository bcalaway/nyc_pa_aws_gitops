<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill &amp; Jessie</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #4a90e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 1.25rem 1rem 3rem;
  }
  /* Height is capped at 37.3vw (~1/2.68, the photo's own aspect ratio) so
     the container is never taller-than-wide relative to the image -- that
     guarantees background-size:cover always crops top/bottom, never the
     sides, at any viewport width. The negative margin-bottom pulls the
     page content up to overlap the lower half of the image, so it shows
     through in the gutters beside the menu/weather cards instead of
     stopping in a hard line right under the title. */
  .hero {
    width: 100%;
    height: min(46vh, 420px, 37.3vw);
    min-height: 90px;
    background:
      linear-gradient(to bottom, rgba(15, 17, 21, 0.85) 0%, rgba(15, 17, 21, 0.05) 25%, rgba(15, 17, 21, 0.45) 55%, rgba(15, 17, 21, 0.98) 100%),
      url('hero.jpg') center bottom / cover no-repeat;
    margin-bottom: calc(min(46vh, 420px, 37.3vw) / -2);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  header {
    text-align: center;
    padding-top: 1.5rem;
  }
  h1 {
    font-weight: 600;
    font-size: 2rem;
    margin: 0;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin: 0 0 0.9rem;
  }
  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .section-head a {
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .section-head a:hover { color: var(--accent); }
  section { margin-bottom: 2.75rem; }

  /* Menu */
  nav.menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2.75rem;
  }
  nav.menu a {
    padding: 0.5rem 1rem;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  nav.menu a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Weather */
  .wx-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
  }
  .wx-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
  }
  .wx-card h3 {
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .wx-current {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }
  .wx-current img { flex-shrink: 0; }
  .wx-temp { font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
  .wx-desc { color: var(--muted); font-size: 0.85rem; }
  .wx-days {
    display: flex;
    justify-content: space-between;
    gap: 0.25rem;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }
  .wx-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    flex: 1;
    min-width: 0;
  }
  .wx-day-name { font-size: 0.7rem; color: var(--muted); }
  .wx-day-temp { font-size: 0.8rem; }
  .wx-error { color: var(--muted); font-size: 0.85rem; margin: 0; }

  /* Woods events */
  .events {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .event-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.8rem 1.2rem;
    border-bottom: 1px solid var(--border);
  }
  .event-row:last-child { border-bottom: none; }
  .event-date {
    color: var(--accent);
    font-size: 0.85rem;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .event-name { text-align: right; }

  footer {
    margin-top: 2.5rem;
    color: #5b6068;
    font-size: 0.8rem;
    text-align: center;
  }
  .footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin-bottom: 0.9rem;
  }
  .footer-links a {
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .footer-links a:hover { color: var(--accent); }
</style>
<!-- Umami: anonymous page-view analytics (Milestone 16), no per-user tracking -->
<script defer src="https://analytics.billandjessie.com/script.js" data-website-id="10c463cb-9ba2-4a0d-966c-777a79fd0b3c"></script>
</head>
<body>
<div class="hero">
  <header>
    <h1>Bill &amp; Jessie</h1>
  </header>
</div>
<main>
  <nav class="menu">
    <a href="https://hue.billandjessie.com">Hue</a>
    <a href="https://todo-app.billandjessie.com">TODO</a>
    <a href="https://grafana.billandjessie.com">Grafana</a>
  </nav>

  <section>
    <div class="section-head">
      <h2>Weather</h2>
      <a href="https://grafana.billandjessie.com/public-dashboards/5b3ef81e8ee54ef7bcee5c02347b07ea">Full dashboard &amp; history →</a>
    </div>
    <div class="wx-grid">
      <div class="wx-card">
        <h3>New York, NY</h3>
        <div id="wx-nyc"><p class="wx-error">Loading…</p></div>
      </div>
      <div class="wx-card">
        <h3>The Woods (Lehighton, PA)</h3>
        <div id="wx-woods"><p class="wx-error">Loading…</p></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Upcoming Weekends — The Woods</h2>
    <div class="events" id="woods-events">
      <p class="wx-error" style="padding:0.9rem 1.2rem;">Loading…</p>
    </div>
  </section>

  <footer>
    <nav class="footer-links">
      <a href="https://status.billandjessie.com">Status</a>
      <a href="https://auth.billandjessie.com">Authentik</a>
      <a href="/network.html">Network Diagram</a>
      <a href="https://analytics.billandjessie.com">Analytics</a>
    </nav>
    billandjessie.com
  </footer>
</main>

<script>
  // Weather: National Weather Service (api.weather.gov) -- free, no API
  // key, CORS-enabled, so this runs entirely client-side with no backend.
  // Forecast grid URLs are pre-resolved (NWS's /points lookup is a one-time
  // "which office/grid covers this coordinate" step, stable per location,
  // no need to redo it on every page load).
  const FORECASTS = {
    'wx-nyc': 'https://api.weather.gov/gridpoints/OKX/34,45/forecast',
    'wx-woods': 'https://api.weather.gov/gridpoints/PHI/28,119/forecast',
  };

  // NWS period `name` is unreliable for deriving a weekday label -- it's
  // sometimes a holiday name instead ("Labor Day" for what would otherwise
  // be "Monday"), which a naive slice(0,3) mangles into "Lab". Derive the
  // label from the period's own startTime instead; only the very first
  // (current) period gets the "Today" special-case.
  const DAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function shortDayName(period, isFirst) {
    if (isFirst) return 'Today';
    return DAY_ABBR[new Date(period.startTime).getDay()];
  }

  function renderForecast(targetId, periods) {
    const el = document.getElementById(targetId);
    const current = periods[0];
    const days = periods.filter((p) => p.isDaytime).slice(0, 7);
    el.innerHTML = `
      <div class="wx-current">
        <img src="${current.icon}" alt="" width="50" height="50" loading="lazy">
        <div>
          <div class="wx-temp">${current.temperature}&deg;${current.temperatureUnit}</div>
          <div class="wx-desc">${current.shortForecast}</div>
        </div>
      </div>
      <div class="wx-days">
        ${days.map((d, i) => `
          <div class="wx-day">
            <div class="wx-day-name">${shortDayName(d, i === 0 && d === periods[0])}</div>
            <img src="${d.icon}" alt="${d.shortForecast}" width="30" height="30" loading="lazy">
            <div class="wx-day-temp">${d.temperature}&deg;</div>
          </div>`).join('')}
      </div>
    `;
  }

  Object.entries(FORECASTS).forEach(([targetId, url]) => {
    fetch(url, { headers: { Accept: 'application/geo+json' } })
      .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then((data) => renderForecast(targetId, data.properties.periods))
      .catch(() => {
        document.getElementById(targetId).innerHTML = '<p class="wx-error">Weather unavailable</p>';
      });
  });

  // Woods weekend themes: refreshed daily from the campground's public
  // Google Calendar by a scheduled GitHub Action (scripts/fetch-woods-
  // calendar.py), which pushes woods-events.json straight to this same S3
  // bucket -- same-origin fetch here, no CORS involved (Google's own ICS
  // feed doesn't support CORS, which is why this isn't fetched directly).
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function formatRange(startIso, endIso) {
    const start = new Date(startIso + 'T00:00:00Z');
    const end = new Date(endIso + 'T00:00:00Z');
    const opts = { month: 'short', day: 'numeric', timeZone: 'UTC' };
    const startStr = start.toLocaleDateString('en-US', opts);
    if (startIso === endIso) return startStr;
    if (start.getUTCMonth() === end.getUTCMonth()) {
      return `${startStr}–${end.toLocaleDateString('en-US', { day: 'numeric', timeZone: 'UTC' })}`;
    }
    return `${startStr}–${end.toLocaleDateString('en-US', opts)}`;
  }

  fetch('/woods-events.json', { cache: 'no-store' })
    .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then((data) => {
      const el = document.getElementById('woods-events');
      if (!data.events || !data.events.length) {
        el.innerHTML = '<p class="wx-error" style="padding:0.9rem 1.2rem;">No upcoming weekends listed</p>';
        return;
      }
      el.innerHTML = data.events.map((e) => `
        <div class="event-row">
          <div class="event-date">${formatRange(e.start, e.end)}</div>
          <div class="event-name">${escapeHtml(e.summary)}</div>
        </div>`).join('');
    })
    .catch(() => {
      document.getElementById('woods-events').innerHTML =
        '<p class="wx-error" style="padding:0.9rem 1.2rem;">Schedule unavailable</p>';
    });
</script>
</body>
</html>

name: CD

# Auto-deploy by default (matches ADR-0019's household-app default) --
# build-push runs on every merge to main, and deploy runs immediately
# after. For manual-promote instead: delete the `deploy` job below, and
# add a separate workflow_dispatch-triggered workflow that calls
# app-deploy.yml on its own (see docs/app-platform.md).

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    uses: bcalaway/nyc_pa_aws_gitops/.github/workflows/app-build-push.yml@main
    with:
      app_name: REPLACE_WITH_APP_NAME
    # secrets: inherit -- passes this repo's own VCPKG_PAT_TOKEN through as
    # app-build-push.yml's `vcpkg_pat` secret. See templates/cpp/Dockerfile
    # for why this specific secret exists (vcpkg's GitHub Packages binary
    # cache). Requires a classic PAT with write:packages/read:packages
    # stored as this repo's own `VCPKG_PAT_TOKEN` Actions secret -- a
    # fine-grained PAT does not work here (confirmed live, see hue's
    # cd.yml/CLAUDE.md for the same fix applied there first).
    secrets: inherit

  deploy:
    needs: build-push
    uses: bcalaway/nyc_pa_aws_gitops/.github/workflows/app-deploy.yml@main
    with:
      app_name: REPLACE_WITH_APP_NAME

# Alembic (database migrations). The database URL is not here: it comes from
# app.db.database_url() in migrations/env.py, so the app and its migrations
# always agree on where the database is.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision files named like 0001_create_items.py (rev ids are set by hand to
# keep them ordered and readable).
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
